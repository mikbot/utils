[versions]
kotlin = "2.4.21"
mikbot = "5.2.3"
ktor = "3.6.1"

[libraries]
# Gradle plugins
mikbot-gradle-plugin = { group = "dev.schlaubi", name = "gradle-plugin", version.ref = "mikbot" }
kotlin-gradle-plugin = { group = "org.jetbrains.kotlin", name = "kotlin-gradle-plugin", version.ref = "kotlin" }
ksp-plugin = { group = "com.google.devtools.ksp", name = "symbol-processing-gradle-plugin", version = "2.3.13" }

mikbot-ktor = { group = "dev.schlaubi", name = "mikbot-ktor" }
mikbot-gdpr = { group = "dev.schlaubi", name = "mikbot-gdpr" }
mikbot-haste-client = { group = "dev.schlaubi", name = "mikbot-haste-client" }
mikbot-kubernetes = { group = "dev.schlaubi", name = "mikbot-kubernetes" }

kmongo-id-serialization = { group = "org.litote.kmongo", name = "kmongo-id-serialization", version = "5.12.0" }

lettuce = { group = "io.lettuce", name = "lettuce-core", version = "7.9.0.RELEASE" }
kotlinx-serialization-protobuf = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-protobuf", version = "1.12.0" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version = "1.11.0" }

ktor-client-java = { group = "io.ktor", name = "ktor-client-java", version.ref = "ktor" }
ktor-client-content-negotiation = { group = "io.ktor", name = "ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { group = "io.ktor", name = "ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-resources = { group = "io.ktor", name = "ktor-client-resources", version.ref = "ktor" }

[plugins]
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
